name: Terraform Apply

on:
  push:
    branches:
      - main

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  id-token: write   # Necessário para autenticação OIDC
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    env:
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_github_org: ${{ vars.GH_ORG }}
      TF_VAR_github_user_id: ${{ vars.GH_USER_ID }}
      TF_VAR_github_repo_infra_id: ${{ vars.GH_REPO_INFRA_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.9"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/bcb-github-actions-oidc
          aws-region: us-east-1

      - name: Limpar lock obsoleto do state
        run: |
          aws dynamodb delete-item \
            --table-name bcb-infra-terraform-locks \
            --key '{"LockID": {"S": "bcb-infra-terraform-state/bcb-infra/terraform.tfstate"}}' \
            --region us-east-1 || true

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: terraform
